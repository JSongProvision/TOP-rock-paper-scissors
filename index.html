<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper, Scissors Game</title>
</head>
<body>
    <p id="welcome-msg">Welcome to tub thumping, the game! Choose an option below to get started</p>
    
    <div id="scorebox">
        <p id="results"></p>
        <p id="score"></p>
    </div>
    
    
    <ul id="choices">
        <button id="rock-btn">Rock</button>
        <button id="paper-btn">Paper</button>
        <button id="scissors-btn">Scissors</button>
    </ul>
   <p id="rules">Rules: Rock beats scissors. Scissors beats paper. Paper beats rock.</p>


    <script src="main.js"></script>
</body>
</html>
